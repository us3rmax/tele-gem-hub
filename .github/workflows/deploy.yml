name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - run: npm install -g bun && bun install --frozen-lockfile
        - run: npm run build
        - run: npx wrangler pages deploy dist --project-name tele-gem-hub --branch main --commit-dirty=true
          env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: 2f46989a2d5628d5cfd32b6237fd476c
